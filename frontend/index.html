<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#022c22">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>MediScan AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022c22 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .logo .accent {
            color: #10b981;
        }
        .status {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .status.ok {
            border: 2px solid #10b981;
        }
        .status.error {
            border: 2px solid #ef4444;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .nav-link {
            display: inline-block;
            padding: 12px 24px;
            background: #10b981;
            color: #022c22;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Medi<span class="accent">Scan</span> AI</h1>
            <p>Clinical AI Triage Assistant</p>
        </div>
        
        <div id="status" class="status">
            <p>Checking connection...</p>
        </div>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="login.html" class="nav-link">Login</a>
            <a href="register.html" class="nav-link">Register</a>
        </div>
    </div>

    <script>
        // Simple test to check if everything is working
        document.addEventListener('DOMContentLoaded', function() {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status ok';
            statusDiv.innerHTML = '<p>✅ App is working correctly!</p><p><small>If you see this, the page loaded successfully.</small></p>';
            
            // Try to fetch the health endpoint
            fetch('/health')
                .then(response => response.json())
                .then(data => {
                    console.log('Health check passed:', data);
                })
                .catch(error => {
                    console.error('Health check failed:', error);
                });
        });
    </script>
</body>
</html>
